[config]

# If true, it will show each file currently prcoessing and the time it took to process it
# If false, only total progress is shown
# This is mostly used for error handling, if something goes wrong it will print error
verbal = false

# If true, output is colorized, enable if your cmd supports colors
colorize = false

# level of compression (0-9, -1 for default)
# Lower number means faster compression without much change to file size
# Higher level is significantly slower but reduces file size by a lot
# 0 is no compression
# -1 is default level, the same as level 6
compressionLevel = -1

# Path from where files are read
inputPath = D:\GitHub\GABRIEL-NEW-OTCV8\

# Path to where encrypted files are written
outputPath = D:\GitHub\OTC--Retronia\

# List of file extensions, these files will be copied to output without encryption (sparate with ,)
copyExtensions = .exe,.dll,.json

# List of directories to ignore completely (sparate with ,)
ignoreDirectories = .git,.github,android,records,tests,tools,src,vc16,client_modulemanager,client_terminal,Tool,vcpkg_installed

# List of files to ignore completely (sparate with ,)
ignoreFiles = .gitignore,.gitattributes,CMakeLists.txt,.exp,.pdb,vcpkg.json

# List of file extensions to ignore completely (sparate with ,)
ignoreExtensions = .lnk,.log,.yml,.lib,.md,.bat

# If file size is bigger than this value (in MB), it will be split into parts
maxFileSize = 700


[crypto]

# use "CryptoV8.exe --key" to generate random
key = 7c1567ed5b0e04c28edd8c9becc268a7ead870ee61d8aebbb33ff1dd3826d0a3
